# The internet server (design.md 6.16, 6.17): the owner's settings. Copy to serve.toml (git ignores it), edit the
# lines marked EDIT, and start serve.bat: supervise = true runs it through scripts/supervise.py. The proxy PC:
# deploy/Caddyfile.example. This PC's firewall (port 8001 from the proxy PC only): deploy/firewall.example.ps1.
# API keys are never read from here (the repository is pushed to a mirror): set SCLMD_API_KEY ("name:key", commas)
# or name a key file outside the repository (api-key-file below). Names are the command line's, with - or _.

supervise = true                 # serve.bat: through the supervisor (restarts after an engine failure; logs\supervise.log)
host = "0.0.0.0"                 # the proxy PC reaches this PC over the LAN (the firewall lets only it in)
port = 8001

# the engine (design.md 6.8, 6.10, 6.13, 6.6, 6.7, 6.15)
int8 = true                      # integer products (lossy option; no loss measured on translation into Korean)
kv4 = true                       # the sliding layers' keys and values at 4 bits (lossy option, KL +0.009)
wide-rows = 256                  # several prompts read in passes of up to 256 rows
keyless = true                   # long conversations: the full-attention layers keep values only (21 KB a token)
context = 40992                  # one conversation: a prompt of 32,768 tokens and a reply of 8,192 (the pass's 32 rows are kept free; 40960 cuts it at 8,160)
typical = 8192                   # the pool's split: conversations at once of 2,000 tokens 4, of 32k 1
prefix-gib = 2                   # shared prompt prefixes in page-locked RAM
image = "auto"                   # starts in about 6 s from an engine image (data\images, 11.7 GB, written once a build)

# limits (scripts/serve_net.py, scripts/serve_contract.py)
max-prompt = 32768               # a longer prompt: 400 context_length_exceeded
max-output = 8192                # a larger max_tokens is cut to it and named in x-sclmd-ignored
max-tokens = 8192                # the reply of a request that does not say
stream-ping = 15                 # ": ping" every 15 s until a stream's first token (a 32k prompt: 22.5 s)
max-body-mb = 32                 # 413 above it
idle-timeout = 120               # an idle connection closed (between requests, or one that stopped sending)
max-connections = 256            # 503 past it

# users (scripts/serve_net.py, scripts/serve_admin.py)
require-key = true               # does not start without an API key (SCLMD_API_KEY or api-key-file)
# api-key-file = "C:/Users/me/sclmd-keys.txt"    # EDIT: "name: key" a line, OUTSIDE the repository
anonymous = true                 # a request without a key is served as its address (IPv4, or IPv6's /64)
trusted-proxies = "192.168.0.10" # EDIT: the proxy PC's LAN address: its X-Forwarded-For alone is read
metrics-local = true             # GET /metrics, and GET /'s counts, from this PC only

# quotas and priorities (scripts/serve_quota.py, sclmd/order.py; design.md 6.18). 6.16's numbers are the defaults:
# a key 500,000 tokens and 600 requests an hour, an address without a key 100,000 and 120, the day 24 times that, all
# requests without a key 20,000,000 tokens a day (tph, rph, ip-tph, ip-rph, daily-times, keyless-day). A key's own:
# "name: key tph=1000000 rph=1200" in the key file.
quotas = true                    # over the hour's quota a request is still served, at a lower priority; the day's: 429
quota-file = "logs/serve_quota.json"   # the counters (tenant ids and numbers only), read back at start
priorities = true                # this PC, then in quota, then over quota 12 steps lower; a step better every 10 s waited
# max-waiting and queue-timeout stay off: each refuses requests (429, 503), and 6.16 refuses only at the daily limit;
# max-connections (256) bounds the requests that wait

# what is written: metadata only (ZDR: no prompt or reply)
request-log = "logs/serve_requests.jsonl"
status-file = "logs/serve_status.json"
